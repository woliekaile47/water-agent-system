temporal_multi_window_evidence_fusion:
  schema_version: phase2d_c21_multi_window_fusion_v1
  algorithm_version: phase2d_c23_recurring_shallow_water_core_v1
  parameter_scope: all_water_depths_and_rain_levels_regression_required
  selection_note: "Fixed prediction-side recurrence rules; unknown-heavy partial windows remain non-authoritative and require cross-window corroboration."
  required_source_frame_count: 1201

  minimum_eligible_window_count: 3
  allowed_partial_gate_reasons:
    - insufficient_high_confidence_water_tracks
    - unknown_fraction_high
  minimum_window_component_area_pixels: 16
  maximum_window_water_fraction: 0.35
  window_ambiguous_component_area_ratio: 0.80
  maximum_window_ambiguous_component_count: 0

  minimum_component_iou: 0.10
  maximum_centroid_distance_pixels: 20.0
  cluster_overlap_tolerance_radius_pixels: 3
  minimum_cluster_window_count: 3
  minimum_cluster_time_span_seconds: 15.0
  ambiguous_cluster_window_count_ratio: 0.80

  minimum_support_window_count: 3
  minimum_support_fraction: 0.50
  minimum_raw_support_window_count: 1
  minimum_final_core_overlap_fraction: 0.10
  support_tolerance_radius_pixels: 4
  probability_weight: 0.50
  support_weight: 0.50
  minimum_fused_confidence: 0.50
  morphology_close_kernel: 3
  minimum_fused_component_area_pixels: 16
  fused_ambiguous_component_area_ratio: 0.80
  maximum_fused_ambiguous_component_count: 0
  unknown_consensus_fraction: 0.50

  required_prompt_status: pass
  safety:
    manual_window_selection_allowed: false
    manual_prompt_fallback_allowed: false
    per_case_parameter_tuning_allowed: false
    prediction_uses_reference_labels: false
    partial_windows_require_spatiotemporal_corroboration: true
    sam2_allowed_only_when_fusion_and_prompt_pass: true
    authoritative: false
    eligible_for_downstream: false
